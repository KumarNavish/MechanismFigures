<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="105mm" viewBox="0 0 1080 630">
<title>A single readout hides the direction</title><desc>Two first-order filters respond to the same step input. Their joint state disambiguates rising and falling phases at the same slow readout of 0.5.</desc>
<rect width="1080" height="630" fill="white"/>
<text x="48" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#24332e" text-anchor="start">One readout. Two different futures.</text>
<text x="48" y="88" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6b766e" text-anchor="start">Analytical demonstration · the same forcing drives a fast and a slow first-order response</text>
