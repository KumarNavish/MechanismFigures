<text x="656" y="452" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#24332e" text-anchor="start">dy/dt = (u − y) / 0.8</text>
<text x="656" y="494" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6b766e" text-anchor="start">u = 1 until t = 2; then u = 0.</text>
