<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="105mm" viewBox="0 0 1080 630">
<title>Projection removes only the forbidden component</title><desc>Analytical example: the Euclidean projection of (-1.8,1.2) onto x &gt;= 0 is (0,1.2). The tangential coordinate remains unchanged.</desc>
<rect width="1080" height="630" fill="white"/>
<text x="48" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#24332e" text-anchor="start">Remove the forbidden component.</text>
<text x="48" y="88" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6b766e" text-anchor="start">Analytical demonstration · Euclidean projection onto the halfspace x ≥ 0</text>
<rect x="380" y="140" width="287" height="367" fill="#edf3ef" stroke="none"/>
<line x1="380" y1="140" x2="380" y2="520" stroke="#315f51" stroke-width="2"/>
<line x1="90" y1="459" x2="671" y2="459" stroke="#6b766e" stroke-width="1.3"/>
<polygon points="671,459 660.0,454.5 660.0,463.5" fill="#6b766e"/>
<line x1="380" y1="520" x2="380" y2="136" stroke="#6b766e" stroke-width="1.3"/>
<polygon points="380,136 375.5,147.0 384.5,147.0" fill="#6b766e"/>
<text x="662" y="492" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6b766e" text-anchor="start">x</text>
<text x="354" y="151" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6b766e" text-anchor="start">y</text>
<text x="408" y="166" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f51" text-anchor="start">feasible: x ≥ 0</text>
<line x1="380" y1="459" x2="155.0" y2="309.0" stroke="#6b766e" stroke-width="3" stroke-dasharray="8 5"/>
<polygon points="155.0,309.0 161.65640235470275,318.8459284829978 166.64870412072983,311.3574758339572" fill="#6b766e"/>
<line x1="380" y1="459" x2="380.0" y2="309.0" stroke="#315f51" stroke-width="5"/>
<polygon points="380.0,309.0 375.5,320.0 384.5,320.0" fill="#315f51"/>
<line x1="155.0" y1="309.0" x2="380.0" y2="309.0" stroke="#ab693b" stroke-width="3"/>
<polygon points="380.0,309.0 369.0,304.5 369.0,313.5" fill="#ab693b"/>
<circle cx="155.0" cy="309.0" r="5" fill="#6b766e"/>
<circle cx="380.0" cy="309.0" r="5" fill="#315f51"/>
<circle cx="380" cy="459" r="4" fill="#24332e"/>
<text x="80" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24332e" text-anchor="start">proposed (−1.8, 1.2)</text>
<text x="407" y="303" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f51" text-anchor="start">projected (0, 1.2)</text>
<text x="198" y="293" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ab693b" text-anchor="start">normal correction</text>
<line x1="380.0" y1="324.0" x2="365.0" y2="324.0" stroke="#6b766e" stroke-width="1.2"/>
<line x1="365.0" y1="324.0" x2="365.0" y2="309.0" stroke="#6b766e" stroke-width="1.2"/>
<text x="367" y="487" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6b766e" text-anchor="start">0</text>
<line x1="700" y1="145" x2="700" y2="525" stroke="#d7e1da" stroke-width="1"/>
<text x="742" y="179" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#24332e" text-anchor="start">The operation</text>
<text x="742" y="217" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#315f51" text-anchor="start">P(x, y) = (max(x, 0), y)</text>
<text x="742" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ab693b" text-anchor="start">Changes</text>
<text x="742" y="311" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#24332e" text-anchor="start">normal coordinate: −1.8 → 0</text>
<text x="742" y="366" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f51" text-anchor="start">Preserves</text>
<text x="742" y="397" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#24332e" text-anchor="start">tangent coordinate: 1.2 → 1.2</text>
<text x="742" y="461" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#24332e" text-anchor="start">Already feasible?</text>
<text x="742" y="492" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6b766e" text-anchor="start">The vector does not move.</text>
<line x1="48" y1="556" x2="1032" y2="556" stroke="#d7e1da" stroke-width="1"/>
<text x="48" y="589" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#24332e" text-anchor="start">The nearest feasible point is reached by an orthogonal displacement—not by shrinking the whole vector.</text>
</svg>
