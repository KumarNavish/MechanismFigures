name: Integrity and regression tests
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repo.py
      - run: python tools/build_gallery.py && git diff --exit-code
      - run: python tools/install.py --dest "$RUNNER_TEMP/isolated-skills"
      - run: python tools/install.py --dest "$RUNNER_TEMP/isolated-skills" --check
      - run: python install.py --global --agents all --home "$RUNNER_TEMP/global-skill-user"
      - run: python install.py --doctor --home "$RUNNER_TEMP/global-skill-user"
  standard-install-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Standard skills CLI, isolated user only
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          export HOME="$RUNNER_TEMP/standard-skill-user"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          npx --yes skills@1.7.2 add . --list
          npx --yes skills@1.7.2 add . -g -a codex -a claude-code -a opencode -y --copy
          python3 tests/verify_standard_install.py
      - name: Render actual calibration and a test-only fixture
        run: |
          node --check scripts/capture.mjs
          node --check kit/motion.mjs
          python3 tests/render_fixture.py "$RUNNER_TEMP/fixture"
          node scripts/capture.mjs "$RUNNER_TEMP/fixture/figure.svg" --out-dir "$RUNNER_TEMP/captures/fixture" --selector svg
          node scripts/capture.mjs assets/gallery.html --out-dir "$RUNNER_TEMP/captures/published-reference" --selector '#bioprint4d' --allow-active
          node scripts/capture.mjs assets/motion.html --out-dir "$RUNNER_TEMP/captures/walkthrough" --selector '.construction-paper' --allow-active --time 27
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rendered-review
          path: ${{ runner.temp }}/captures/
          retention-days: 7
