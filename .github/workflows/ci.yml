name: Integrity and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repo.py
      - run: python tools/build_gallery.py && git diff --exit-code
      - run: python tools/install.py --dest "$RUNNER_TEMP/isolated-skills"
      - run: python tools/install.py --dest "$RUNNER_TEMP/isolated-skills" --check
